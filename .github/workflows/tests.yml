name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements_test.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsndfile1
      - name: Install PyTorch
        run: python -m pip install --upgrade pip wheel && python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -r tools/requirements_test.txt -e .
      - name: Install s3prl
        run: |
          git clone --depth 1 https://github.com/s3prl/s3prl.git "$RUNNER_TEMP/s3prl"
          python -m pip install -e "$RUNNER_TEMP/s3prl"
          python - <<'PY'
          import os
          from pathlib import Path

          hub = Path(os.environ["RUNNER_TEMP"]) / "s3prl/s3prl/hub.py"
          lines = hub.read_text().splitlines()
          supported = ("s3prl.upstream.hubert.hubconf", "s3prl.upstream.espnet_hubert.hubconf")
          hub.write_text(
              "\n".join(
                  line
                  for line in lines
                  if "from s3prl.upstream." not in line or any(item in line for item in supported)
              )
              + "\n"
          )
          PY
      - name: Run tests
        env:
          PYTHONPATH: ${{ runner.temp }}/s3prl
        run: pytest tests --config_dir tests/test_config --wav_dir tests/test_wavs
